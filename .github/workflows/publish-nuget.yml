name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '包版本号（留空则使用 Directory.Build.props 里的 Version）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push to nuget.org
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -like "v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host "使用 Directory.Build.props 里的默认版本"
            "arg=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "使用版本: $version"
            "arg=-p:Version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        shell: pwsh
        run: dotnet pack -c Release --no-build -o artifacts ${{ steps.version.outputs.arg }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "缺少仓库 Secret：NUGET_API_KEY（Settings → Secrets and variables → Actions）"
          }

          $packages = @()
          $packages += Get-ChildItem artifacts/*.nupkg -ErrorAction SilentlyContinue
          $packages += Get-ChildItem artifacts/*.snupkg -ErrorAction SilentlyContinue

          if ($packages.Count -eq 0) {
            throw "没有找到可推送的包，请检查 dotnet pack 输出"
          }

          foreach ($package in $packages) {
            Write-Host "Pushing $($package.Name)"
            dotnet nuget push $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "推送失败: $($package.Name)"
            }
          }

          Write-Host "完成：已推送 $($packages.Count) 个包"
